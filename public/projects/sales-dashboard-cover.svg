      <rect x="24" y="50" width="110" height="26" rx="6" fill="#ffffff" fill-opacity="0.16" />
      <rect x="24" y="88" width="60" height="10" rx="5" fill="#ffffff" fill-opacity="0.28" />
    </g>
    <g transform="translate(488,0)">
