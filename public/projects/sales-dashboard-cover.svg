<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0b" />
      <stop offset="100%" stop-color="#131314" />
    </linearGradient>
    <radialGradient id="sdGlow1" cx="18%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="sdGlow2" cx="85%" cy="18%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#sdBg)" />
  <rect width="1200" height="800" fill="url(#sdGlow1)" />
  <rect width="1200" height="800" fill="url(#sdGlow2)" />

  <g stroke="#ffffff" stroke-opacity="0.03">
