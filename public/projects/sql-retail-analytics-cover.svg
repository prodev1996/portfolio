<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="srBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0b" />
      <stop offset="100%" stop-color="#131314" />
    </linearGradient>
    <radialGradient id="srGlow1" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#f0b429" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#f0b429" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="srGlow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#srBg)" />
  <rect width="1200" height="800" fill="url(#srGlow1)" />
  <rect width="1200" height="800" fill="url(#srGlow2)" />

  <g stroke="#ffffff" stroke-opacity="0.03">
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="640" x2="1200" y2="640" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
  </g>

  <!-- schema connector lines: customers -> orders -> order_items <- products -> categories -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="2" fill="none">
    <path d="M270,150 L430,240" />
    <path d="M270,530 L430,300" />
    <path d="M600,240 L600,360" />
    <path d="M770,150 L620,360" />
    <path d="M770,530 L640,400" />
    <path d="M930,150 L800,150" />
  </g>

  <!-- customers table -->
  <g transform="translate(90,90)">
    <rect width="180" height="120" rx="10" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1" />
    <rect width="180" height="30" rx="10" fill="#ffffff" fill-opacity="0.14" />
    <text x="16" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f3f1ea">customers</text>
    <rect x="16" y="44" width="120" height="9" rx="4" fill="#ffffff" fill-opacity="0.18" />
    <rect x="16" y="62" width="90" height="9" rx="4" fill="#ffffff" fill-opacity="0.12" />
    <rect x="16" y="80" width="110" height="9" rx="4" fill="#ffffff" fill-opacity="0.12" />
    <rect x="16" y="98" width="70" height="9" rx="4" fill="#ffffff" fill-opacity="0.12" />
  </g>

  <!-- orders table -->
  <g transform="translate(90,470)">
    <rect width="180" height="120" rx="10" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1" />
    <rect width="180" height="30" rx="10" fill="#ffffff" fill-opacity="0.14" />
    <text x="16" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f3f1ea">orders</text>
    <rect x="16" y="44" width="120" height="9" rx="4" fill="#ffffff" fill-opacity="0.18" />
    <rect x="16" y="62" width="100" height="9" rx="4" fill="#ffffff" fill-opacity="0.12" />
    <rect x="16" y="80" width="80" height="9" rx="4" fill="#ffffff" fill-opacity="0.12" />
    <rect x="16" y="98" width="110" height="9" rx="4" fill="#ffffff" fill-opacity="0.12" />
  </g>

  <!-- order_items table (center, the hub of the schema) -->
  <g transform="translate(440,290)">
    <rect width="200" height="130" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#f0b429" stroke-opacity="0.3" />
    <rect width="200" height="32" rx="10" fill="#f0b429" fill-opacity="0.9" />
    <text x="16" y="21" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0a0a0b">order_items</text>
    <rect x="16" y="48" width="130" height="9" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <rect x="16" y="66" width="100" height="9" rx="4" fill="#ffffff" fill-opacity="0.13" />
    <rect x="16" y="84" width="120" height="9" rx="4" fill="#ffffff" fill-opacity="0.13" />
    <rect x="16" y="102" width="90" height="9" rx="4" fill="#ffffff" fill-opacity="0.13" />
  </g>

  <!-- products table -->
  <g transform="translate(800,90)">
    <rect width="180" height="120" rx="10" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1" />
    <rect width="180" height="30" rx="10" fill="#ffffff" fill-opacity="0.14" />
    <text x="16" y="20" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#f3f1ea">products</text>
    <rect x="16" y="44" width="120" height="9" rx="4" fill="#ffffff" fill-opacity="0.18" />
    <rect x="16" y="62" width="90" height="9" rx="4" fill="#ffffff" fill-opacity="0.12" />
    <rect x="16" y="80" width="110" height="9" rx="4" fill="#ffffff" fill-opacity="0.12" />
    <rect x="16" y="98" width="70" height="9" rx="4" fill="#ffffff" fill-opacity="0.12" />
  </g>

  <!-- categories table -->
  <g transform="translate(1000,90)">
    <rect width="150" height="100" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" />
    <rect width="150" height="28" rx="10" fill="#ffffff" fill-opacity="0.1" />
    <text x="14" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#f3f1ea">categories</text>
    <rect x="14" y="40" width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.16" />
    <rect x="14" y="56" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.1" />
    <rect x="14" y="72" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.1" />
  </g>

  <!-- window-function badge: RANK() / LAG() flavor -->
  <g transform="translate(830,470)">
    <rect width="270" height="120" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="20" y="34" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#f0b429">RANK() OVER (</text>
    <text x="20" y="58" font-family="Consolas, monospace" font-size="15" fill="#f3f1ea">  PARTITION BY category</text>
    <text x="20" y="82" font-family="Consolas, monospace" font-size="15" fill="#f3f1ea">  ORDER BY revenue DESC</text>
    <text x="20" y="106" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#f0b429">)</text>
  </g>
</svg>
