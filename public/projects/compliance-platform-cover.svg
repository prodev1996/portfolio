      <rect x="24" y="24" width="90" height="22" rx="11" fill="url(#barB)" fill-opacity="0.85" />
      <text x="24" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e9e6f5">Auditor</text>
      <rect x="24" y="92" width="232" height="12" rx="6" fill="#ffffff" fill-opacity="0.12" />
      <rect x="24" y="116" width="170" height="12" rx="6" fill="#ffffff" fill-opacity="0.08" />
      <rect x="24" y="140" width="220" height="12" rx="6" fill="#ffffff" fill-opacity="0.08" />
      <rect x="24" y="176" width="232" height="86" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" />
      <circle cx="56" cy="210" r="14" fill="#1e9b73" fill-opacity="0.28" />
      <path d="M50 210 l4 5 l9 -10" stroke="#7be3c2" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="82" y="203" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.12" />
      <rect x="82" y="221" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.08" />
    </g>

    <g transform="translate(640,40)">
      <rect width="280" height="350" rx="18" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="24" y="24" width="90" height="22" rx="11" fill="url(#barC)" fill-opacity="0.85" />
      <text x="24" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e9e6f5">Client</text>
