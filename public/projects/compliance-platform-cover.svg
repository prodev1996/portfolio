      <rect x="40" y="212" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.09" />
      <rect x="40" y="232" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.09" />
    </g>
  </g>

  <!-- shield badge -->
  <g transform="translate(560,90)">
    <circle cx="40" cy="40" r="40" fill="url(#shieldGrad)" fill-opacity="0.9" />
    <path d="M40 18 L60 26 V42 C60 55 52 63 40 68 C28 63 20 55 20 42 V26 Z" fill="#0a0910" fill-opacity="0.9" />
    <path d="M31 42 L37 48 L50 33" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
