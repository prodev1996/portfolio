      <rect x="24" y="24" width="90" height="22" rx="11" fill="url(#barA)" fill-opacity="0.85" />
      <text x="24" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#e9e6f5">Admin</text>
      <rect x="24" y="92" width="232" height="12" rx="6" fill="#ffffff" fill-opacity="0.12" />
      <rect x="24" y="116" width="190" height="12" rx="6" fill="#ffffff" fill-opacity="0.08" />
      <rect x="24" y="140" width="210" height="12" rx="6" fill="#ffffff" fill-opacity="0.08" />
      <rect x="24" y="176" width="232" height="86" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" />
      <rect x="40" y="196" width="150" height="10" rx="5" fill="#ffffff" fill-opacity="0.14" />
      <rect x="40" y="216" width="110" height="10" rx="5" fill="#ffffff" fill-opacity="0.09" />
      <rect x="40" y="236" width="130" height="10" rx="5" fill="#ffffff" fill-opacity="0.09" />
    </g>

