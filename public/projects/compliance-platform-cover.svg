      <stop offset="0%" stop-color="#0a0910" />
      <stop offset="100%" stop-color="#120f1d" />
    </linearGradient>
    <radialGradient id="glow1" cx="18%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#6f67df" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6f67df" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="86%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#c55b9e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c55b9e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow3" cx="70%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#1e9b73" stop-opacity="0.22" />
