  </defs>

  <rect width="1200" height="727" fill="url(#bg)" />
  <rect width="1200" height="727" fill="url(#glow1)" />
  <rect width="1200" height="727" fill="url(#glow2)" />
  <rect width="1200" height="727" fill="url(#glow3)" />

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.035">
    <line x1="0" y1="121" x2="1200" y2="121" />
    <line x1="0" y1="242" x2="1200" y2="242" />
    <line x1="0" y1="363" x2="1200" y2="363" />
    <line x1="0" y1="484" x2="1200" y2="484" />
    <line x1="0" y1="605" x2="1200" y2="605" />
    <line x1="150" y1="0" x2="150" y2="727" />
    <line x1="350" y1="0" x2="350" y2="727" />
    <line x1="550" y1="0" x2="550" y2="727" />
    <line x1="750" y1="0" x2="750" y2="727" />
    <line x1="950" y1="0" x2="950" y2="727" />
    <line x1="1150" y1="0" x2="1150" y2="727" />
